<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shortify Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca'
                        }
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-slate-100 text-slate-800 antialiased">
    <div class="flex min-h-screen items-center justify-center p-6">
        <div class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 shadow-soft">
            <div class="mb-8 text-center">
                <div
                    class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-600 text-2xl font-bold text-white shadow-lg shadow-brand-500/30">
                    S</div>
                <h1 class="text-3xl font-bold tracking-tight text-slate-900">Welcome back</h1>
                <p class="mt-2 text-sm text-slate-500">Sign in to manage your short links.</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="username" class="mb-2 block text-sm font-medium text-slate-700">Username</label>
                    <input id="username" name="username" type="text" value="admin"
                        class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-brand-500 focus:bg-white" />
                </div>

                <div>
                    <label for="password" class="mb-2 block text-sm font-medium text-slate-700">Password</label>
                    <input id="password" name="password" type="password" value="admin123"
                        class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-brand-500 focus:bg-white" />
                </div>

                <div id="loginError"
                    class="hidden rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"></div>

                <button type="submit"
                    class="w-full rounded-xl bg-brand-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-brand-700">Sign
                    In</button>
            </form>

            <div class="mt-6 rounded-2xl border border-slate-200 bg-slate-50 p-3 text-xs text-slate-500">
                Default credentials: <strong class="text-slate-700">admin / admin123</strong>
            </div>
        </div>
    </div>

    <script src="/login.js"></script>
</body>

</html>
